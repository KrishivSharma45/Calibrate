{% extends "base.html" %}
{% block title %}Log in · Dogfood Portal{% endblock %}
{% block content %}
<article class="narrow">
  <h1>Log in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autocomplete="username"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit">Log in</button>
  </form>
  <p><small>No account? <a href="/register">Register as a participant</a>.</small></p>
</article>
{% endblock %}
